<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0000ff">
<link rel="manifest" href="./manifest.webmanifest">
<title>単色ライト</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0000ff}
body{display:flex;align-items:flex-end;justify-content:center}
#controls{margin:0 0 24px;padding:14px 20px;background:#222;border-radius:40px;display:flex;gap:14px;align-items:center}
#color{width:90px;height:58px;border:0;background:none;padding:0}
button{font-size:18px;padding:14px 24px;border:0;border-radius:28px}
#show{display:none;position:fixed;right:16px;bottom:16px;font-size:28px;padding:10px 14px;background:#222;color:white}
</style>
</head>
<body>
<div id="controls">
<input id="color" type="color" value="#0000ff" aria-label="色を選択">
<button id="hide">操作を隠す</button>
</div>
<button id="show" aria-label="操作を表示">🎨</button>
<script>
const color=document.getElementById('color'), controls=document.getElementById('controls'), hide=document.getElementById('hide'), show=document.getElementById('show');
function setColor(){document.body.style.background=color.value;document.documentElement.style.background=color.value}
color.addEventListener('input',setColor);
hide.onclick=()=>{controls.style.display='none';show.style.display='block'};
show.onclick=()=>{controls.style.display='flex';show.style.display='none'};
setColor();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
